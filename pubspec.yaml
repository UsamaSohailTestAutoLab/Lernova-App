name: lingoquest
description: "LingoQuest - an original language learning experience."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  confetti: ^0.8.0
  flutter_tts: ^4.2.2
  intl: ^0.20.2
  speech_to_text: ^7.4.0
  in_app_purchase: ^3.3.0
  # The store-specific packages are direct dependencies only so the Pro
  # screen can read a plan's introductory offer: the shared
  # ProductDetails carries a price but not a free trial, and that fact
  # lives on the platform product underneath it.
  in_app_purchase_android: ^0.5.3
  in_app_purchase_storekit: ^0.4.12
  permission_handler: ^13.0.2
  # Wraps SKStoreReviewController on iOS and the Play In-App Review API
  # on Android. Apple requires the system prompt — a custom rate-us
  # dialog is a guideline violation — so this is the only way to ask.
  in_app_review: ^2.0.10
  # Opens the store account pages. Auto-renewable subscriptions have to
  # give the buyer a way to manage and cancel, and both stores expose
  # that only as a URL.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/fun/
    - assets/images/

  # Bundled so headings render correctly offline (google_fonts fetches at
  # runtime otherwise) and so Arabic renders without a network round trip
  # once interface localization ships. Noto Sans JP is deliberately NOT
  # bundled yet — the full variable font is ~9.6MB; it gets subsetted down
  # to only the glyphs the Japanese translations actually use once those
  # strings exist, rather than shipping the whole CJK repertoire today.
  # Japanese text falls back to the platform's own CJK font until then.
  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
          weight: 600
        - asset: assets/fonts/Baloo2.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic.ttf
          weight: 700
